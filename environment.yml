name: atlaspipe

# Reference environment for documenting the pipeline dependencies.
# On the Garnatxa cluster, the official SLURM jobs intentionally use
# separate existing environments: Renv, Biom and MicrobeAtlas. See README.md.
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - r-base
  - r-data.table
  - r-tidyverse
  - r-optparse
  - vsearch
  - biom-format
  - wget
  - gzip
